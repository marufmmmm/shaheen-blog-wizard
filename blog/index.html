            --light: #f8f8f8;
            --text: #333;
            --border: #e0e0e0;
            --bg-hover: #fafafa;
        }

        body {

            border-color: var(--primary);
        }

            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;

        }

            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;

            font-weight: bold;

            color: var(--dark);

            const months = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন',

            const date = new Date(dateString);
            const day = date.getDate();
            const month = months[date.getMonth()];
            const year = date.getFullYear();
            return `${day} ${month}, ${year}`;

            currentPage = 1;
            currentFilter = 'all';
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.category-btn').classList.add('active');

            filteredPosts = samplePosts.filter(post =>
                post.title.toLowerCase().includes(searchTerm) ||
                post.title_en.toLowerCase().includes(searchTerm) ||
                post.excerpt.toLowerCase().includes(searchTerm)
            );

            displayPosts();
        }

        // Allow search on Enter key
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        handleSearch();
                    }
                });
            }
        });

        // Display Posts
        function displayPosts() {
            const container = document.getElementById('postsContainer');
            const startIndex = (currentPage - 1) * postsPerPage;
            const endIndex = startIndex + postsPerPage;
            const paginatedPosts = filteredPosts.slice(startIndex, endIndex);

            if (paginatedPosts.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1;">
                        <div class="empty-state">
                            <h3>📭 কোনো পোস্ট পাওয়া যায়নি (No posts found)</h3>
                            <p>অন্য ক্যাটাগরি বা সার্চ টার্ম চেষ্টা করুন</p>
                        </div>
                    </div>
                `;
                document.getElementById('pageInfo').innerHTML = '';
                document.getElementById('pageNumbers').innerHTML = '';
                document.getElementById('prevBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
                return;
            }

            container.innerHTML = paginatedPosts.map(post => `
                <div class="blog-card" onclick="viewPost(${post.id})">
                    <img src="${post.image}" alt="${post.title}" class="blog-image">
                    <div class="blog-content">
                        <span class="blog-category">${post.category_bn}</span>
                        <h3 class="blog-title">${post.title}</h3>
                        <p class="blog-excerpt">${post.excerpt}</p>
                        <div class="blog-meta">
                            <span class="blog-author">✍️ ${post.author}</span>
                            <span class="blog-date">${formatBengaliDate(post.date)}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            updatePagination();
        }

        // Update Pagination
        function updatePagination() {
            const totalPages = Math.ceil(filteredPosts.length / postsPerPage);
            const pageInfo = document.getElementById('pageInfo');
            const pageNumbers = document.getElementById('pageNumbers');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            pageInfo.innerHTML = `পৃষ্ঠা ${currentPage} / ${totalPages} | মোট পোস্ট: ${filteredPosts.length}`;

            pageNumbers.innerHTML = Array.from({length: totalPages}, (_, i) => i + 1)
                .map(page => `<button class="pagination-page ${page === currentPage ? 'active' : ''}" onclick="goToPage(${page})">${page}</button>`)
                .join('');

            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
        }

        // Pagination Functions
        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                displayPosts();
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredPosts.length / postsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                displayPosts();
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        }

        function goToPage(page) {
            currentPage = page;
            displayPosts();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // View Single Post
        function viewPost(postId) {
            const post = samplePosts.find(p => p.id === postId);
            if (post) {
                // Store post data in session storage and redirect
                sessionStorage.setItem('selectedPost', JSON.stringify(post));
                // In a real implementation, this would redirect to single.html
                alert(`📖 Post: ${post.title}\n\n${post.content}\n\n- By ${post.author}`);
            }
        }

        // Add some CSS for pagination buttons
        const style = document.createElement('style');
        style.textContent = `
            .pagination-page {
                padding: 8px 12px;
                min-width: 40px;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
